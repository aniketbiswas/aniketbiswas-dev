name: Public website health

on:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check pages, assets, and TLS expiry
        run: node scripts/check-site.js
